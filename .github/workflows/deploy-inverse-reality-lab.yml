name: Mirror Inverse Reality Lab to Pages docs

on:
  push:
    paths:
      - 'labs/inverse-reality-lab/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror lab into docs
        shell: bash
        run: |
          rm -rf docs/labs/inverse-reality-lab
          mkdir -p docs/labs
          cp -R labs/inverse-reality-lab docs/labs/inverse-reality-lab

      - name: Commit mirror
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/labs/inverse-reality-lab
          if ! git diff --cached --quiet; then
            git commit -m "Mirror Inverse Reality Lab to GitHub Pages docs"
            git push
          fi
