name: Build Inverse Reality Lab paper

on:
  push:
    paths:
      - 'labs/inverse-reality-lab/paper/inverse-causal-construction-v0.1.md'
      - 'labs/inverse-reality-lab/paper/references.bib'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PDF with Pandoc + LaTeX
        uses: docker://pandoc/latex:3.1
        with:
          args: >-
            --from=markdown+tex_math_dollars
            --pdf-engine=xelatex
            --citeproc
            --bibliography=labs/inverse-reality-lab/paper/references.bib
            -V geometry:margin=1in
            -V colorlinks=true
            -V linkcolor=blue
            -V urlcolor=blue
            -o labs/inverse-reality-lab/paper/inverse-causal-construction-v0.1.pdf
            labs/inverse-reality-lab/paper/inverse-causal-construction-v0.1.md

      - name: Commit generated PDF safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/inverse-reality-lab/paper/inverse-causal-construction-v0.1.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build Inverse Causal Construction preprint PDF"
            git pull --rebase origin main
            git push origin main
          fi
