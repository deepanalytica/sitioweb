name: Build Inverse Reality Lab paper

on:
  push:
    paths:
      - 'labs/inverse-reality-lab/paper/inverse-causal-construction-v0.1.tex'
      - '.github/workflows/build-inverse-reality-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: inverse-causal-construction-v0.1.tex
          working_directory: labs/inverse-reality-lab/paper
          latexmk_use_xelatex: false

      - name: Commit generated PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/inverse-reality-lab/paper/inverse-causal-construction-v0.1.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build Inverse Causal Construction preprint PDF"
            git push
          fi
